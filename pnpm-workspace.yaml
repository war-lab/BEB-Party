packages:
  - shared/core
  - shared/engine
  - shared/games/detectives
  - shared/games/dontsayit
  - shared/games/ranking
  - shared/games/whowrotethis
  - server/core
  - server/games/detectives
  - server/games/dontsayit
  - server/games/ranking
  - server/games/whowrotethis
  - client/core
  - client/games/detectives
  - client/games/dontsayit
  - client/games/ranking
  - client/games/whowrotethis
  - client/app
  - tools
  - movies
allowBuilds:
  esbuild: true
  workerd: true
  # ムービーの書き出しに使うffmpeg/ffprobeの実体（@motion-canvas/ffmpegの依存）。
  # postinstallは同梱バイナリへの `chmod u+x` であり、Linuxではこれが無いと実行できない。
  # pnpm 11は未承認のビルドを警告ではなくエラーにするため、CI(Linux)の依存名で宣言する
  "@ffmpeg-installer/linux-x64": true
  "@ffprobe-installer/linux-x64": true
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.21.2'
  - '@cloudflare/workers-types@5.20260813.1'
  - eslint-plugin-svelte@3.23.0
  - globals@17.11.0
  - miniflare@5.20260811.0-alpha
  - svelte@5.56.9
  - wrangler@4.122.0
